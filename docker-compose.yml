services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homespace
      POSTGRES_USER: homespace
      POSTGRES_PASSWORD: homespace
    ports:
      - "5432:5432"
    volumes:
      - homespace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homespace -d homespace"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: homespace
      MINIO_ROOT_PASSWORD: homespace-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - homespace-objects:/data

volumes:
  homespace-postgres:
  homespace-objects:
